name: Laravel Auto Deployment

on:
  push:
    branches: ["main", "dev"]

jobs:
  test-ftp:
    runs-on: ubuntu-latest

    steps:

      - name: Show runner public IP
        run: curl -s https://api.ipify.org && echo

      - name: Test FTP port 21
        run: |
          HOST="${{ secrets.FTP_SERVER }}"

          if timeout 12 bash -c "echo > /dev/tcp/$HOST/21" 2>/dev/null; then
            echo "SUCCESS: TCP port 21 is reachable"
          else
            echo "FAILED: Cannot establish TCP connection to port 21"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test FTP reachability
        run: nc -vz -w 10 ${{ secrets.FTP_SERVER }} 21

      # - name: Install FTP client
      #   run: sudo apt-get update && sudo apt-get install -y lftp

      # - name: Test FTP connection
      #   env:
      #     FTP_HOST: ${{ secrets.FTP_SERVER }}
      #     FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      #     FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      #   run: |
      #     lftp -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_HOST" -e "
      #       set net:timeout 10
